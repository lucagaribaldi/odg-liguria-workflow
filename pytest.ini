[tool:pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --strict-markers
    --tb=short
    --cov=src
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-report=xml
    --cov-fail-under=80
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow tests
    requires_api: Tests that require API access
    requires_notion: Tests that require Notion access
    requires_anthropic: Tests that require Anthropic API access
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning